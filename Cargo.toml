[workspace]
resolver = "2"
members = [
    "crates/comic-ocr-core",
    "crates/comic-ocr-pdp",
    "crates/comic-ocr-ort",
    "crates/comic-ocr-runtime",
    "crates/comic-ocr-cli",
    "crates/comic-ocr-py",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Zach Shallbetter"]
license = "Apache-2.0"
repository = "https://github.com/zachshallbetter/comic-ocr-rust"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
anyhow = "1.0"
ort = { version = "2.0.0-rc.4", features = ["load-dynamic"] }
image = "0.25"
clap = { version = "4.5", features = ["derive", "env"] }
