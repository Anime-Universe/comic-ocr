name: Rust & Pipeline CI

on:
  push:
    branches: [ "master", "main", "rust-migration" ]
  pull_request:
    branches: [ "master", "main", "rust-migration" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, Lint & Test Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Format
        run: cargo fmt --all --check

      - name: Clippy Lint (All Targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Cargo Workspace Tests
        run: cargo test --workspace

      - name: Run Pipeline Quality Gate
        run: python3 scripts/run_pipeline.py --gate
